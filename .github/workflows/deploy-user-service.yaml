name: Deploy User Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: project-4d486229-502c-4ea7-890
  GAR_LOCATION: asia-southeast1
  GAR_REPO: laravel-microservices-repo
  IMAGE_NAME: user-service
  CLUSTER_NAME: poc-gke-cluster
  CLUSTER_ZONE: asia-southeast1
  NAMESPACE: production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys
          sed -i 's/APP_URL=.*/APP_URL=http:\/\/localhost/' .env

      - name: Execute Tests (Pest)
        run: |
          vendor/bin/pest

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/167435028488/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider-v2"
          service_account: "github-actions-sa@project-4d486229-502c-4ea7-890.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to GAR
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - name: Set up Kustomize
        run: |-
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy to GKE
        run: |
          # 1. Move to the new Kustomize production overlay directory
          cd k8s/overlays/production/

          # 2. Update .env.secret for the Cloud SQL Auth Proxy sidecar
          sed -i "s/DB_HOST=.*/DB_HOST=127.0.0.1/" .env.secret
          sed -i "s/DB_PORT=.*/DB_PORT=5432/" .env.secret
          sed -i "s/DB_DATABASE=.*/DB_DATABASE=${{ secrets.DB_DATABASE }}/" .env.secret
          sed -i "s/DB_USERNAME=.*/DB_USERNAME=${{ secrets.DB_USERNAME }}/" .env.secret
          sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/" .env.secret

          # 3. Ensure the namespace exists before deploying
          kubectl get namespace ${{ env.NAMESPACE }} || kubectl create namespace ${{ env.NAMESPACE }}

          # 4. Dynamically swap the image tag in kustomization.yaml
          kustomize edit set image base-image:placeholder=${{ env.IMAGE_TAG }}

          # 5. Delete old migration job (using the component=migration label)
          kubectl delete job -l component=migration --ignore-not-found -n ${{ env.NAMESPACE }}

          # 6. Build Kustomize manifests and apply directly to GKE
          kustomize build . | kubectl apply -f -

          # 7. Wait for the database migration to complete
          kubectl wait --for=condition=complete job/migrate --timeout=120s -n ${{ env.NAMESPACE }}
          
          # 8. Ensure BOTH the Web and Worker deployments roll out successfully
          kubectl rollout status deployment/laravel-app -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/user-service-worker -n ${{ env.NAMESPACE }}