name: Deploy User Service

on:
  push:
    branches:
      - main
  workflow_dispatch: # This gives you a manual 'Run workflow' button!

env:
  PROJECT_ID: project-501674b6-7d67-40dc-99c
  GAR_LOCATION: asia-southeast1
  GAR_REPO: laravel-microservices-repo
  IMAGE_NAME: user-service
  CLUSTER_NAME: poc-gke-cluster
  CLUSTER_ZONE: asia-southeast1-a
  NAMESPACE: production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672

    # 2. REQUIRED FOR KEYLESS AUTH: Allows GitHub to request an OIDC token from Google
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4" # Change this to match your Laravel app's PHP version
          tools: composer:v2

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys
          sed -i 's/APP_URL=.*/APP_URL=http:\/\/localhost/' .env

      - name: Execute Tests (Pest)
        run: |
          vendor/bin/pest

      # 3. Authenticate to Google Cloud (No JSON Keys!)
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1094681141696/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-sa@project-501674b6-7d67-40dc-99c.iam.gserviceaccount.com"

      # 4. Configure Docker to use the GCP credentials
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # 5. Build and Push the Docker Image with a unique Git commit SHA
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Assuming your Laravel Dockerfile is inside the src/user-service folder
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

          # Save the tag for the next steps
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 6. Authenticate to your GKE Cluster
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      # 7. Install standalone Kustomize CLI
      - name: Set up Kustomize
        run: |-
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      # 8. The Deployment Sequence
      - name: Deploy to GKE
        run: |
          cd k8s/apps/user-service/

          # A. Dynamically swap "base-image:placeholder" with the newly built image
          kustomize edit set image base-image:placeholder=${{ env.IMAGE_TAG }}

          # B. Delete the old migration job so Kubernetes allows us to create a new one
          kubectl delete job -l component=migration --ignore-not-found -n ${{ env.NAMESPACE }}

          # C. Apply the fully compiled Blueprint + Overlay to GKE
          kustomize build . | kubectl apply -n ${{ env.NAMESPACE }} -f -

          # D. Wait for the database migration to succeed before continuing
          kubectl wait --for=condition=complete job/user-service-migrate --timeout=120s -n ${{ env.NAMESPACE }}

          # E. Verify the web deployment rolls out successfully
          kubectl rollout status deployment/user-service-laravel-app -n ${{ env.NAMESPACE }}
