apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

# Automatically converts .env.config into a Kubernetes ConfigMap
configMapGenerator:
  - name: app-env-config
    envs:
      - .env.config   # Relative path from this kustomization.yaml

# Automatically converts .env.secret into a Kubernetes Secret
secretGenerator:
  - name: app-env-secret
    envs:
      - .env.secret   # Relative path from this kustomization.yaml

patches:
  - path: deployment-patch.yaml
  - path: worker-patch.yaml

images:
  - name: base-image:placeholder
    newName: asia-southeast1-docker.pkg.dev/your-project-id/user-service-repo/user-service
    newTag: latest