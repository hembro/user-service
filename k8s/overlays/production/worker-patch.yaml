apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-worker
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: poc-gke-node-pool
      containers:
      - name: application
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"